	<!-- Main Wrapper -->
  <div class="main-wrapper login-body">
    <div class="login-wrapper">
      <div class="container">
          <div class="loginbox" style="max-width: 872px;   min-height: 590px;">
              <div class="login-left" style="width: 360px">
      <img class="img-fluid" src="assets/img/logo-white.png" alt="Logo">
                </div>
                <div class="login-right">
      <div class="login-right-wrap" style="    margin-left: 120px;">
        <h1>Forgot Password?</h1>
        <p class="account-subtitle">Enter your email to get a password reset link</p>

        <!-- Form -->
        <form [formGroup]="resetpass">
          <div class="form-group">
            <input class="form-control" type="text" formControlName="email" placeholder="Email">
            <div style="color:red;" *ngIf="resetpass.get('email')?.hasError('required') && resetpass.get('email')?.touched" class="alert alert-danger">
      Email   is required

                               </div>
          </div>
          <div class="form-group mb-0">
            <button class="btn btn-primary btn-block" (click)="resetpassword()" [disabled]="resetpass.invalid" type="submit">Reset Password</button>
          </div>
        </form>
        <!-- /Form -->

        <div class="text-center dont-have">Remember your password? <a routerLink="">Login</a></div>
      </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- /Main Wrapper -->
