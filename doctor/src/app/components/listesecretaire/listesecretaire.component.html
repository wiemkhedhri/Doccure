<app-navbar>
</app-navbar>
<div class="content" >
  <div class="container-fluid" style="    margin-left: 64px;">

    <div class="row">


      <div class="col-md-7 col-lg-8 col-xl-11">
        <div class="appointments" *ngFor="let s of secrtaireliste">

          <!-- Appointment List -->
          <div class="appointment-list"  >
            <div class="profile-info-widget">
              <a href="patient-profile.html" class="booking-doc-img" >
                <img src="http://localhost:8081/acteur/files/{{s.photo}}" alt="User Image">
              </a>
              <div class="profile-det-info">
                <h3><a href="patient-profile.html">{{s.nomprenom}}</a></h3>
                <div class="patient-details">

                  <h5><i class="fas fa-map-marker-alt"></i> {{s.adresse}}</h5>
                  <h5><i class="fas fa-envelope"></i> {{s.email}}</h5>
                  <h5 class="mb-0"><i class="fas fa-phone"></i> {{s.numtel}}</h5>
                  <h5><i class="far fa-clock"></i> {{s.datenaissance}}</h5>
                </div>
              </div>
            </div>
            <div class="appointment-action">


              <a href="javascript:void(0);" class="btn btn-sm bg-danger-light" (click)="supprimersecretaire(s.id)">
                <i class="fas fa-times"   ></i>Supprimer
              </a>
            </div>
          </div>
          <!-- /Appointment List -->




        </div>
      </div>
    </div>

  </div>

</div>
<app-footer></app-footer>
