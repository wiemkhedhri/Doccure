<div class="col-md-12">
  <h4 class="mb-4">Patient Appoinment</h4>
  <div class="appointment-tab">

    <!-- Appointment Tab -->
    <ul class="nav nav-tabs nav-tabs-solid nav-tabs-rounded">
      <li class="nav-item">
        <a class="nav-link active" href="#upcoming-appointments" data-toggle="tab">Upcoming </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#today-appointments" data-toggle="tab">Today's Appoinment</a>
      </li>
    </ul>
    <!-- /Appointment Tab -->

    <div class="tab-content">

      <!-- Upcoming Appointment Tab -->
      <div class="tab-pane show active" id="upcoming-appointments">
        <div class="card card-table mb-0">
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-hover table-center mb-0">
                <thead>
                  <tr>
                    <th>Patient Name</th>
                    <th>Appt Date</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let r of upcomingg">
                    <td>
                      <h2 class="table-avatar">
                        <a  class="avatar avatar-sm mr-2"><img class="avatar-img rounded-circle" src="http://localhost:8081/medecin/files/{{r.patientRV.photo}}" alt="User Image"></a>
                        <a >{{r.patientRV.nomprenom}}</a>
                      </h2>
                    </td>
                    <td>{{r.starttime|date:'medium'}}   </td>



                    <td class="text-right">
                      <div class="table-action">
                        <a  *ngIf="r.patientvrai== 'true'"  style="margin-right: 5px;"  class="btn btn-sm bg-success-light" (click)="accepter(r.coderv)">
                          <i class="fas fa-check"></i> Accept
                        </a>

                        <a  *ngIf="currentuser1['role']=='medecin'"  routerLink="/dashbord/detaillepatient/{{r.coderv}}" class="btn btn-sm bg-info-light">
                          <i class="far fa-eye"></i> View
                        </a>


                        <a (click)="supprimer(r.coderv)" href="javascript:void(0);" class="btn btn-sm bg-danger-light">
                          <i class="fas fa-times"></i> supprimer
                        </a>
                        <!-- <a href="javascript:void(0);" class="btn btn-sm bg-danger-light">
                          <i class="fas fa-times"></i> Cancel
                        </a> -->
                      </div>
                    </td>
                  </tr>

                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
      <!-- /Upcoming Appointment Tab -->

      <!-- Today Appointment Tab -->
      <div class="tab-pane" id="today-appointments">
        <div class="card card-table mb-0">
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-hover table-center mb-0" >
                <thead>
                  <tr>
                    <th>Patient Name</th>
                    <th>App Date</th>

                    <th></th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let r of listerendezvousbydate">
                    <td>
                      <h2 class="table-avatar">
                        <a  class="avatar avatar-sm mr-2"><img class="avatar-img rounded-circle" src="http://localhost:8080/patient/files/{{r.patientRV.photo}}"  alt="User Image"></a>
                        <a >{{r.patientRV.nomprenom}}</a>
                      </h2>
                    </td>
                    <td>{{r.starttime|date:'medium'}} </td>

                    <td class="text-right">
                      <div class="table-action">
                        <a   *ngIf="r.patientvrai== 'true'"   style="margin-right: 5px;"  class="btn btn-sm bg-success-light">
                          <i class="fas fa-check"></i> Accept
                        </a>
                        <a  *ngIf="currentuser1['role']=='medecin'" routerLink="/dashbord/detaillepatient/{{r.coderv}}" class="btn btn-sm bg-info-light">
                          <i class="far fa-eye" ></i> View
                        </a>
                        <a (click)="supprimer(r.coderv)" href="javascript:void(0);" class="btn btn-sm bg-danger-light">
                          <i class="fas fa-times"></i> supprimer
                        </a>


                      </div>
                    </td>
                  </tr>

                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
      <!-- /Today Appointment Tab -->

    </div>
  </div>
</div>
