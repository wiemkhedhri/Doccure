<head>
  <style>
  body {

    background-repeat: no-repeat;
    background-attachment: fixed;
    background-size: 100% 100%;
    height: 677px;
  }
  </style>



  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  </head>




<body>
  <br>
  <br>


<div class="container" id="container">
	<div class="form-container sign-up-container">
		<form [formGroup]="forgetpass" (ngSubmit)="confirmemail()">
			<h2 style="font-family: 'Poppins';">Forget Password?</h2>

<hr>
			<input type="email" placeholder="Email" name="nom" required formControlName="email"  />
      <div style="color:red;    width: 459px;" *ngIf="forgetpass.get('email')?.hasError('required') && forgetpass.get('email')?.touched" class="alert alert-danger">
        Email  is required

                         </div>

<hr>
			<button type="submit" [disabled]="forgetpass.invalid"  >
    Reset Password</button>
		</form>
	</div>
	<div class="form-container sign-in-container">
		<form [formGroup]="LoginForm"  (ngSubmit)="login()"  >
			<h2 style="font-family: 'Poppins';">Login Doccure</h2>
			<div class="social-container">


			</div>


    <input  type="email" formControlName="email"   placeholder="Email " >
    <div style="color:red;    width: 459px;" *ngIf="LoginForm.get('email')?.hasError('required') && LoginForm.get('email')?.touched" class="alert alert-danger">
      Email  is required

                       </div>


    <input  type="password"  formControlName="password" placeholder="password " >
    <div style="color:red;    width: 459px;" *ngIf="LoginForm.get('password')?.hasError('required') && LoginForm.get('password')?.touched" class="alert alert-danger">
      Password   is required

                       </div>

			<button type="submit"  >     Login </button>
		</form>
	</div>
	<div class="overlay-container">
		<div class="overlay">
			<div class="overlay-panel overlay-left">
				<h1>Hello!</h1>
				<p style="    color: black;">Enter your email to get a password reset link</p>
				<button class="ghost" id="signIn">
          Remember your password?</button>
			</div>
			<div class="overlay-panel overlay-right">
				<h1>Welcome Back!</h1>
				<p style="    color: black;">

Log In With Your Personal Information</p>
				<button class="ghost" id="signUp">
          Forgot Password?</button>
			</div>
		</div>
	</div>
</div>

</body>
