
<app-navbar></app-navbar>
<div>
  <img src="assets/img/secretaire.jpg" style="    width: 1688px;
  height: 423px;">
</div>


<!-- Page Wrapper -->
<div class="page-wrapper">
  <div class="content container-fluid">

<!-- Page Header -->

<!-- /Page Header -->
<hr>
<div class="row" style="    width: 1059px;margin-left: 166px;">
<div class="col-lg-12">
<div class="card">
  <div class="card-header">
    <h4 class="card-title">Add Secretary </h4>
  </div>
  <div class="card-body">
    <form [formGroup]="AddForm"  (ngSubmit)="addsecretaire()" >
      <div class="form-group row">
        <label class="col-form-label col-md-2">First Name and Last Name</label>
        <div class="col-md-10">
          <input type="text" class="form-control" formControlName="nomprenom">
          <div style="color:red;    " *ngIf="AddForm.get('nomprenom')?.hasError('required') && AddForm.get('nomprenom')?.touched" class="alert alert-danger">
       Firstname and Lastname     is required

                             </div>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-form-label col-md-2">Date of birth</label>
        <div class="col-md-10">
          <input type="date" class="form-control" formControlName="datenaissance">
          <div style="color:red;    " *ngIf="AddForm.get('datenaissance')?.hasError('required') && AddForm.get('datenaissance')?.touched" class="alert alert-danger">
           Date of birth    is required

                                   </div>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-form-label col-md-2">Sexe</label>
        <div class="col-md-10">
          <select name="mmm"class="form-control" formControlName="sexe" >
            <option value="">-- Select --</option>
            <option>Female</option>
            <option>Male</option>
          </select>
          <div style="color:red;    " *ngIf="AddForm.get('sexe')?.hasError('required') && AddForm.get('sexe')?.touched" class="alert alert-danger">
            Sexe   is required

                                   </div>
        </div>
      </div>


      <div class="form-group row">
        <label class="col-form-label col-md-2">Phone Number</label>
        <div class="col-md-10">
          <input type="number" class="form-control" formControlName="numtel">
          <div style="color:red;    " *ngIf="AddForm.get('numtel')?.hasError('required') && AddForm.get('numtel')?.touched" class="alert alert-danger">
            Phone Number   is required

                                   </div>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-form-label col-md-2">Social State</label>
        <div class="col-md-10">
          <select name="mmm"class="form-control" formControlName="etatsociale" >
            <option value="">-- Select --</option>
            <option>Single</option>
            <option>Maried</option>
          </select>
          <div style="color:red; " *ngIf="AddForm.get('etatsociale')?.hasError('required') && AddForm.get('etatsociale')?.touched" class="alert alert-danger">
      Social State  is required

                                   </div>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-form-label col-md-2">Adress</label>
        <div class="col-md-10">
          <input type="text" class="form-control" formControlName="adresse" >
          <div style="color:red; " *ngIf="AddForm.get('adresse')?.hasError('required') && AddForm.get('adresse')?.touched" class="alert alert-danger">
     Adress is required

                                         </div>
        </div>
      </div>

      <div class="form-group row">
        <label class="col-form-label col-lg-2">Email</label>
        <div class="col-lg-10">
          <div class="input-group">
            <div class="input-group-prepend">
              <span class="input-group-text" id="sizing-addon2">@</span>
            </div>
            <input type="text" class="form-control" formControlName="email" placeholder="Entrez Votre email" aria-describedby="sizing-addon2">
            <div style="color:red; " *ngIf="AddForm.get('email')?.hasError('required') && AddForm.get('email')?.touched" class="alert alert-danger">
             Email is required

                                                  </div>
          </div>
        </div>
      </div>

      <div class="form-group row">
        <label class="col-form-label col-md-2">Level of Studies</label>
        <div class="col-md-10">
          <input type="text" class="form-control"  formControlName="niveauetudes">
          <div style="color:red; " *ngIf="AddForm.get('email')?.hasError('required') && AddForm.get('email')?.touched" class="alert alert-danger">
            Email is required

                                                 </div>
        </div>
      </div>


      <div class="form-group mb-0" style="margin-left: 539px;">
        <button class="btn btn-primary" [disabled]="AddForm.invalid"  style="    width: 279px;    margin-left: -182px;" type="submit">Register</button>
        <button class="btn btn-danger"  style="    width: 279px;    margin-left: 13px;" type="reset">anunler</button>
      </div>


    </form>
  </div>
</div>
</div>
</div>
</div>
</div>
<app-footer></app-footer>
