	<!-- Main Wrapper -->
  <div class="main-wrapper">

    <!-- Header -->
    <app-navbar></app-navbar>
    <!-- /Header -->

    <!-- Page Content -->
    <div class="content">
      <div class="container-fluid">

        <div class="row">
          <div class="col-md-8 offset-md-2">

            <!-- Login Tab Content -->
            <div class="account-content">
              <div class="row align-items-center justify-content-center">
                <div class="col-md-7 col-lg-6 login-left">
                  <img src="assets/img/login-banner.png" class="img-fluid" alt="Doccure Login">
                </div>
                <div class="col-md-12 col-lg-6 login-right">
                  <div class="login-header">
                    <h3>Login <span>Doccure</span></h3>
                  </div>
                  <form  (ngSubmit)="login()" [formGroup]="loginform">
                    <div class="form-group">
                      <label for="text">
                        Email</label>
                      <input
                          formControlName="email"

                          type="email"
                          class="form-control">
                      <div *ngIf="loginform.get('email')?.hasError('required') && loginform.get('email')?.touched" class="alert alert-danger">
                          <div *ngIf="loginform.get('email')?.hasError('required') && loginform.get('email')?.touched">
                            Your email is required.</div>

                      </div>
                  </div>
                  <div class="form-group">
                    <label for="text">
                      Password</label>
                    <input
                        formControlName="password"

                        type="password"
                        class="form-control">
                    <div *ngIf="loginform.get('password')?.hasError('required') && loginform.get('password')?.touched" class="alert alert-danger">
                        <div *ngIf="loginform.get('password')?.hasError('required') && loginform.get('password')?.touched">
                          Your Password is required.</div>

                    </div>
                </div>




                    <div class="text-right">
                      <a class="forgot-link" routerLink="../forgetpassword">Forgot Password ?</a>
                    </div>
                    <button class="btn btn-primary btn-block btn-lg login-btn" [disabled]="loginform.invalid"  type="submit">Login</button>


                    <div class="text-center dont-have">Don’t have an account? <a routerLink="../register">Register</a></div>
                  </form>
                </div>
              </div>
            </div>
            <!-- /Login Tab Content -->

          </div>
        </div>

      </div>

    </div>
    <!-- /Page Content -->

    <!-- Footer -->
  <app-footer></app-footer>
    <!-- /Footer -->

  </div>
  <!-- /Main Wrapper -->
