<div class="card">
  <div class="card-body">
    <div class="row">
      <div class="col-md-12 col-lg-6">

        <!-- Change Password Form -->
        <form [formGroup]="changepass" (ngSubmit)="updatepassword()">
          <div class="form-group">
            <label>Old Password</label>
            <input type="password" class="form-control" formControlName="password">
            <div
            style="color: red"
            *ngIf="
            changepass   .get('password')   ?.hasError('required') &&   changepass.get('password')?.touched "
            class="alert alert-danger"
          >
            Old Password  is required
          </div>
          </div>
          <div class="form-group">
            <label>New Password</label>
            <input type="password" class="form-control" formControlName="newpassword">
            <div
            style="color: red"
            *ngIf="
            changepass   .get('newpassword')   ?.hasError('required') &&   changepass.get('newpassword')?.touched "
            class="alert alert-danger"
          >
          new password Password  is required
          </div>
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" class="form-control" formControlName="confirmpassword">
            <div
            style="color: red"
            *ngIf="
            changepass   .get('confirmpassword')   ?.hasError('required') &&   changepass.get('confirmpassword')?.touched "
            class="alert alert-danger"
          >
          confirm  Password  is required
          </div>
          <div

          style="color: red"
            *ngIf=" f['confirmpassword'].errors && f['confirmpassword'].errors['confirmedValidator']"
          >
            Confirm password and password does not match
          </div>
          </div>
          <div class="submit-section">
            <button type="submit" class="btn btn-primary submit-btn">Save Changes</button>
          </div>
        </form>
        <!-- /Change Password Form -->

      </div>
    </div>
  </div>
</div>
