
<div class="card">
  <div class="card-body">
    <form  [formGroup]="updateimage">
    <div class="col-12 col-md-12">
      <div class="form-group">
        <div class="change-avatar">
          <div class="profile-img">
            <img src="http://localhost:8081/patient/files/{{currentuser?.photo}}" alt="User Image">
          </div>
          <div class="upload-img">
            <div class="change-photo-btn">
              <span><i class="fa fa-upload"></i> Upload Photo</span>
              <input type="file" class="upload"   (change)="handleFileInput($event)" >
            </div>

          </div>
        </div>
      </div>
    </div>
  </form>
    <!-- Profile Settings Form -->
    <form  [formGroup]="Updateform" (ngSubmit)="updatepatient()">
      <div class="row form-row">

        <div class="col-12 col-md-6">
          <div class="form-group">
            <label>FirstName And LastName</label>
            <input type="text" class="form-control" formControlName="nomprenom">
            <div *ngIf="Updateform.get('nomprenom')?.hasError('required') && Updateform.get('nomprenom')?.touched" class="alert alert-danger">
              <div *ngIf="Updateform.get('nomprenom')?.hasError('required') && Updateform.get('nomprenom')?.touched"> FirstName and Lastname is required.</div>

          </div>
          </div>
        </div>
        <div class="col-12 col-md-6">
          <div class="form-group">
            <label>Gender</label>
            <select  class="form-control floating" class="form-control" formControlName="sexe">
              <option value="">-- Select --</option>
              <option>Female</option>
              <option>Male</option>
            </select>
            <div *ngIf="Updateform.get('sexe')?.hasError('required') && Updateform.get('sexe')?.touched" class="alert alert-danger">
              <div *ngIf="Updateform.get('sexe')?.hasError('required') && Updateform.get('sexe')?.touched"> Gender is required.</div>

          </div>
          </div>
        </div>
        <div class="col-12 col-md-6">
          <div class="form-group">
            <label>Date of Birth</label>

              <input type="date" class="form-control datetimepicker" formControlName="datenaissance">
              <div *ngIf="Updateform.get('datenaissance')?.hasError('required') && Updateform.get('datenaissance')?.touched" class="alert alert-danger">
                <div *ngIf="Updateform.get('datenaissance')?.hasError('required') && Updateform.get('datenaissance')?.touched"> Date of Birth is required.</div>

            </div>

          </div>
        </div>
        <div class="col-12 col-md-6">
          <div class="form-group">
            <label>Social State</label>
            <select class="form-control select" class="form-control" formControlName="etatsociale">
              <option value="">-- Select --</option>
              <option>Single</option>
              <option>Maried</option>
            </select>
            <div *ngIf="Updateform.get('etatsociale')?.hasError('required') && Updateform.get('etatsociale')?.touched" class="alert alert-danger">
              <div *ngIf="Updateform.get('etatsociale')?.hasError('required') && Updateform.get('etatsociale')?.touched"> Social State is required.</div>
          </div>
          </div>
        </div>
        <div class="col-12 col-md-6">
          <div class="form-group">
            <label>Phone Number</label>
            <input type="number" class="form-control" formControlName="numtel">
            <div *ngIf="Updateform.get('numtel')?.hasError('required') && Updateform.get('numtel')?.touched" class="alert alert-danger">
              <div *ngIf="Updateform.get('numtel')?.hasError('required') && Updateform.get('numtel')?.touched"> Phone Number is required.</div>

          </div>
          </div>
        </div>
        <div class="col-12 col-md-6">
          <div class="form-group">
            <label>Address</label>
            <input type="text"  class="form-control" formControlName="adresse">
            <div *ngIf="Updateform.get('adresse')?.hasError('required') && Updateform.get('adresse')?.touched" class="alert alert-danger">
              <div *ngIf="Updateform.get('adresse')?.hasError('required') && Updateform.get('adresse')?.touched">
                Address is required.</div>

          </div>
          </div>
        </div>
        <div class="col-12">
          <div class="form-group">
          <label>Email</label>
            <input type="email" class="form-control" formControlName="email">
            <div *ngIf="Updateform.get('email')?.hasError('required') && Updateform.get('email')?.touched" class="alert alert-danger">
              <div *ngIf="Updateform.get('email')?.hasError('required') && Updateform.get('email')?.touched">
                Your email is required.</div>

          </div>
          </div>
        </div>



      </div>
      <div class="submit-section">
        <button type="submit" class="btn btn-primary submit-btn">Save Changes</button>
      </div>
    </form>
    <!-- /Profile Settings Form -->

  </div>
</div>
