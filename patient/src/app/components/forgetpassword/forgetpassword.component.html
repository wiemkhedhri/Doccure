<body class="account-page">

  <!-- Main Wrapper -->
  <div class="main-wrapper">

    <!-- Header -->
    <app-navbar></app-navbar>
    <!-- /Header -->

    <!-- Page Content -->
    <div class="content">
      <div class="container-fluid">

        <div class="row">
          <div class="col-md-8 offset-md-2">

            <!-- Account Content -->
            <div class="account-content">
              <div class="row align-items-center justify-content-center">
                <div class="col-md-7 col-lg-6 login-left">
                  <img src="assets/img/login-banner.png" class="img-fluid" alt="Login Banner">
                </div>
                <div class="col-md-12 col-lg-6 login-right">
                  <div class="login-header">
                    <h3>Forgot Password?</h3>
                    <p class="small text-muted">Enter your email to get a password reset link</p>
                  </div>

                  <!-- Forgot Password Form -->
                  <form [formGroup]="resetpass" (ngSubmit)="resetpassword()">
                    <div class="form-group">
                      <label for="text">
                        Email</label>
                      <input
                          formControlName="email"

                          type="email"
                          class="form-control">
                      <div *ngIf="resetpass.get('email')?.hasError('required') && resetpass.get('email')?.touched" class="alert alert-danger">
                          <div *ngIf="resetpass.get('email')?.hasError('required') && resetpass.get('email')?.touched">
                            Email is required.</div>

                      </div>
                  </div>
                    <div class="text-right">
                      <a class="forgot-link" routerLink="../login">Remember your password?</a>
                    </div>
                    <button class="btn btn-primary btn-block btn-lg login-btn" [disabled]="resetpass.invalid" type="submit">Reset Password</button>
                  </form>
                  <!-- /Forgot Password Form -->

                </div>
              </div>
            </div>
            <!-- /Account Content -->

          </div>
        </div>

      </div>

    </div>
    <!-- /Page Content -->

    <!-- Footer -->
 <app-footer></app-footer>
    <!-- /Footer -->

  </div>
  <!-- /Main Wrapper -->


</body>
